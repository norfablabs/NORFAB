[project]
name = "norfab"
version = "0.26.2"
description = "Network Automations Fabric [NorFab] - communication networks automations"
requires-python = ">=3.10,<3.15"
authors = [{name = "Denis Mulyalin", email = "d.mulyalin@gmail.com"}]
maintainers = [{name = "Denis Mulyalin", email = "d.mulyalin@gmail.com"}]
license = "Apache-2.0"
readme = "README.md"
keywords = ["Network", "Automation", "DevOps"]
classifiers = [
    "Topic :: Utilities",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "pyyaml==6.0.3",
    "pyzmq==27.2.0",
    "psutil==7.2.2",
    "tornado==6.5.10",
    "jinja2==3.1.6",
    "pydantic==2.14.1",
    "mdutils==1.8.1",
    "orjson==3.13.0",
    "python-dotenv==1.2.4",
    "gitpython==3.2.1",
]

[project.urls]
Homepage = "https://github.com/norfablabs/NORFAB"
Repository = "https://github.com/norfablabs/NORFAB"
Documentation = "https://docs.norfablabs.com"

[project.scripts]
nfcli = "norfab.utils.nfcli:nfcli"

