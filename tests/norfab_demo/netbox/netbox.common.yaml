service: netbox
netbox_connect_timeout: 10
netbox_read_timeout: 300
instances:
  prod:
    default: true
    url: {{ env.get("NETBOX_PROD_URL", "http://netbox.lab:8000") | tojson }}
    token: {{ env.get("NETBOX_PROD_TOKEN", "") | tojson }}
    ssl_verify: {{ env.get("NETBOX_SSL_VERIFY", "true") | lower }}
