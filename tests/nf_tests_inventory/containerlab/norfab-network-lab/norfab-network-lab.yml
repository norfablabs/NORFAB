# Containerlab network topology file

name: norfab-network-lab

topology:
  nodes:
    ceos-spine-1:
      kind: ceos
      image: ceosimage:4.35.2F  
      mgmt-ipv4: 172.100.100.10
      ports:
        - 2200:22
        - 8800:80
        - 8300:830
        - 4400:443
        - 11610:161/udp
    ceos-spine-2: 
      kind: ceos
      image: ceosimage:4.35.2F  
      mgmt-ipv4: 172.100.100.11
      ports:
        - 2201:22
        - 8801:80
        - 8301:830
        - 4401:443
        - 11611:161/udp
    ceos-leaf-1: 
      kind: ceos
      image: ceosimage:4.35.2F  
      mgmt-ipv4: 172.100.100.12
      ports:
        - 2202:22
        - 8802:80
        - 8302:830
        - 4402:443
        - 11612:161/udp
    ceos-leaf-2: 
      kind: ceos
      image: ceosimage:4.35.2F  
      mgmt-ipv4: 172.100.100.13
      ports:
        - 2203:22
        - 8803:80
        - 8303:830
        - 4403:443
        - 11613:161/udp
    ceos-leaf-3: 
      kind: ceos
      image: ceosimage:4.35.2F  
      mgmt-ipv4: 172.100.100.14
      ports:
        - 2204:22
        - 8804:80
        - 8304:830
        - 4404:443
        - 11614:161/udp
    vmx-1:
      kind: juniper_vmx
      image: vrnetlab/juniper_vmx:23.2R2-S1.3
      mgmt-ipv4: 172.100.100.15
      ports:
        - 2205:22
        - 8805:80
        - 8305:830
        - 4405:443
        - 11615:161/udp
        
    iol-r1:
      kind: cisco_iol
      image: vrnetlab/cisco_iol:17.16.1a
      mgmt-ipv4: 172.100.100.16
      ports:
        - 2206:22
        - 8806:80
        - 8306:830
        - 4406:443
        - 11616:161/udp

    csr1k-r1:
      kind: cisco_csr1000v
      image: vrnetlab/cisco_csr1000v:17.03.08
      mgmt-ipv4: 172.100.100.17
      ports:
        - 2207:22
        - 8807:80
        - 8307:830
        - 4407:443
        - 11617:161/udp

  links:
    - endpoints: ["ceos-spine-1:eth1", "ceos-spine-2:eth1"]
    - endpoints: ["ceos-spine-1:eth2", "ceos-leaf-1:eth1"]
    - endpoints: ["ceos-spine-2:eth2", "ceos-leaf-1:eth2"]
    - endpoints: ["ceos-spine-1:eth3", "ceos-leaf-2:eth1"]
    - endpoints: ["ceos-spine-2:eth3", "ceos-leaf-2:eth2"]
    - endpoints: ["ceos-spine-1:eth4", "ceos-leaf-3:eth1"]
    - endpoints: ["ceos-spine-2:eth4", "ceos-leaf-3:eth2"]
    - endpoints: ["ceos-spine-2:eth5", "vmx-1:eth1"]  
    - endpoints: ["ceos-leaf-1:eth7", "iol-r1:eth1"]
    - endpoints: ["ceos-leaf-2:eth7", "csr1k-r1:eth1"]
    
    # Unconnected physical ports used by the CLOS test fixtures.
    - {type: dummy, endpoint: {node: ceos-spine-1, interface: eth6}}
    - {type: dummy, endpoint: {node: ceos-spine-1, interface: eth7}}
    - {type: dummy, endpoint: {node: ceos-spine-1, interface: eth8}}
    - {type: dummy, endpoint: {node: ceos-spine-1, interface: eth9}}
    - {type: dummy, endpoint: {node: ceos-spine-2, interface: eth6}}
    - {type: dummy, endpoint: {node: ceos-spine-2, interface: eth7}}
    - {type: dummy, endpoint: {node: ceos-spine-2, interface: eth8}}
    - {type: dummy, endpoint: {node: ceos-spine-2, interface: eth9}}
    - {type: dummy, endpoint: {node: ceos-leaf-1, interface: eth3}}
    - {type: dummy, endpoint: {node: ceos-leaf-1, interface: eth4}}
    - {type: dummy, endpoint: {node: ceos-leaf-1, interface: eth5}}
    - {type: dummy, endpoint: {node: ceos-leaf-1, interface: eth6}}
    - {type: dummy, endpoint: {node: ceos-leaf-2, interface: eth3}}
    - {type: dummy, endpoint: {node: ceos-leaf-2, interface: eth4}}
    - {type: dummy, endpoint: {node: ceos-leaf-2, interface: eth5}}
    - {type: dummy, endpoint: {node: ceos-leaf-2, interface: eth6}}
    - {type: dummy, endpoint: {node: ceos-leaf-3, interface: eth3}}
    - {type: dummy, endpoint: {node: ceos-leaf-3, interface: eth4}}
    - {type: dummy, endpoint: {node: ceos-leaf-3, interface: eth5}}
    - {type: dummy, endpoint: {node: ceos-leaf-3, interface: eth6}}

mgmt:
  network: norfab_network_lab_mgmt    # management network name
  ipv4-subnet: 172.100.100.0/24       # ipv4 range
