name: NFCEOS_CEOS_LEAF_1
initial_prompt: '{base_prompt}>'
commands:
  enable:
    output: null
    new_prompt: '{base_prompt}#'
    prompt: '{base_prompt}>'
    help: enter privileged exec mode
  terminal width 511:
    output: |
      Width set to 511 columns.
    prompt:
    - '{base_prompt}>'
    - '{base_prompt}#'
    help: set terminal width
  term width 0:
    alias: terminal width 511
  terminal length 0:
    output: |
      Pagination disabled.
    prompt:
    - '{base_prompt}>'
    - '{base_prompt}#'
    help: disable pagination
  term length 0:
    alias: terminal length 0
  show running-config section interface:
    alias: show run section interface
  show running-config section vlan:
    alias: show run section vlan
  show running-config section vrf:
    alias: show run section vrf
  show running-config | include community-list:
    output: |
      ip community-list BLUE_EXPORT permit 65000:100
      ip extcommunity-list VPN_BLUE permit rt 65000:200
      ip extcommunity-list SITE_ORIGIN permit soo 65000:300
  configure terminal:
    output: null
    new_prompt: '{base_prompt}(config)#'
    prompt: '{base_prompt}#'
    help: enter configuration mode
  config term:
    alias: configure terminal
  conf t:
    alias: configure terminal
  end:
    output: |2+

    new_prompt: '{base_prompt}#'
    prompt: '{base_prompt}(config)#'
    help: leave configuration mode
  delete file_copy_test.txt:
    output: |2+

    prompt: '{base_prompt}#'
    help: delete copied test file
  exit:
    output: true
    prompt:
    - '{base_prompt}>'
    - '{base_prompt}#'
    - '{base_prompt}(config)#'
    help: exit shell
  _default_:
    output: |
      % Invalid input
    help: output for unknown commands
  show version:
