name: NFCEOS_CEOS_SPINE_2
initial_prompt: '{base_prompt}>'
commands:
  enable:
    output: null
    new_prompt: '{base_prompt}#'
    prompt: '{base_prompt}>'
    help: enter privileged exec mode
  terminal width 511:
    output: |
      Width set to 511 columns.
    prompt:
    - '{base_prompt}>'
    - '{base_prompt}#'
