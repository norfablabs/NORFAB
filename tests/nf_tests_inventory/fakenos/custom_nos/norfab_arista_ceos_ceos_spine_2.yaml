  configure terminal:
    output: null
    new_prompt: '{base_prompt}(config)#'
    prompt: '{base_prompt}#'
    help: enter configuration mode
  config term:
    alias: configure terminal
  conf t:
    alias: configure terminal
  end:
    output: |2+

    new_prompt: '{base_prompt}#'
    prompt: '{base_prompt}(config)#'
    help: leave configuration mode
  delete file_copy_test.txt:
    output: |2+

    prompt: '{base_prompt}#'
    help: delete copied test file
  exit:
    output: true
    prompt:
    - '{base_prompt}>'
    - '{base_prompt}#'
    - '{base_prompt}(config)#'
    help: exit shell
