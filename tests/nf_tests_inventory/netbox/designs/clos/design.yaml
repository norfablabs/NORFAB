design_input_schema:
  type: object
  properties:
    site: {type: string, minLength: 1, maxLength: 50, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'}
    prefix: {type: string}
  required: [site, prefix]
  additionalProperties: false
jinja_functions:
  fabric_pool: nf://netbox/design/clos_v1/addressing.py

{% set pool = fabric_pool(context.prefix) %}
{% set site, group = context.site, context.site ~ '-vlans' %}
{% set nodes = ['spine-1', 'spine-2', 'leaf-1', 'leaf-2', 'leaf-3'] %}
{% set vlans = [(100, 'mgmt'), (110, 'data'), (120, 'control')] %}
manufacturers: [{name: Arista}]
platforms: [{name: arista_eos, manufacturer: Arista}]
device_types: [{model: Arista cEOS, manufacturer: Arista, u_height: 0}]
device_roles: [{name: clos-spine, color: '2196f3'}, {name: clos-leaf, color: '4caf50'}]
sites: [{name: '{{ site }}', status: active}]
rirs: [{name: CLOS-PRIVATE, is_private: true}]
asn_ranges: [{name: '{{ site }}-asns', rir: CLOS-PRIVATE, start: 65001, end: 65005}]
asns:
{% for i in range(5) %}
  - {asn: {{ 65001 + i }}, rir: CLOS-PRIVATE, description: '{{ site }}-{{ nodes[i] }}', sites: ['{{ site }}']}
{% endfor %}
vlan_groups: [{name: '{{ group }}', site: '{{ site }}', vid_ranges: [[100, 200]]}]
vlans:
{% for vid, name in vlans %}
  - {vid: {{ vid }}, name: '{{ name }}', group: '{{ group }}', status: active}
{% endfor %}
prefixes:
  - {prefix: '{{ pool }}', site: '{{ site }}', status: container, description: '{{ site }} fabric'}
  - {prefix: '{{ pool[0] }}/27', site: '{{ site }}', status: container, description: '{{ site }} P2P pool'}
  - {prefix: '{{ pool[32] }}/27', site: '{{ site }}', description: '{{ site }} loopbacks'}
{% for link in range(6) %}
  - {prefix: '{{ pool[2 * link] }}/31', site: '{{ site }}', description: '{{ site }} spine-{{ link // 3 + 1 }} to leaf-{{ link % 3 + 1 }}'}
{% endfor %}
{% for zone in range(2) %}
{% for vid, name in vlans %}
  - {prefix: '{{ pool[256 * (1 + zone * 3 + loop.index0)] }}/24', site: '{{ site }}', vlan: {group: '{{ group }}', vid: {{ vid }}}, description: '{{ site }} {{ "leaf-1/2" if zone == 0 else "leaf-3" }} {{ name }}'}
{% endfor %}
{% endfor %}
devices:
{% for i in range(5) %}
{% set leaf = i >= 2 %}
  - name: '{{ site }}-{{ nodes[i] }}'
    site: '{{ site }}'
    role: clos-{{ 'leaf' if leaf else 'spine' }}
    device_type: {manufacturer: Arista, model: Arista cEOS}
    platform: arista_eos
    status: active
    interfaces:
      Loopback0: {type: virtual, ip_addresses: [{address: '{{ pool[33 + i] }}/32'}]}
{% for peer in (range(2) if leaf else range(2, 5)) %}
{% set link = peer * 3 + i - 2 if leaf else i * 3 + peer - 2 %}
      Ethernet{{ peer + 1 if leaf else peer - 1 }}:
        type: 1000base-t
        description: 'to {{ site }}-{{ nodes[peer] }}'
        ip_addresses: [{address: '{{ pool[2 * link + (1 if leaf else 0)] }}/31'}]
{% if not leaf %}
        connection: {device: '{{ site }}-{{ nodes[peer] }}', interface: Ethernet{{ i + 1 }}, type: cat6, status: connected}
{% endif %}
{% endfor %}
{% if leaf %}
{% for vid, name in vlans %}
{% set subnet = 256 * (1 + (3 if i == 4 else 0) + loop.index0) %}
      Ethernet{{ loop.index + 2 }}: {type: 1000base-t, description: '{{ name }} access', mode: access, untagged_vlan: {group: '{{ group }}', vid: {{ vid }}}}
      Vlan{{ vid }}:
        type: virtual
        mode: access
        untagged_vlan: {group: '{{ group }}', vid: {{ vid }}}
        ip_addresses: [{address: '{{ pool[subnet + (1 if i == 4 else i)] }}/24'}]
{% if i != 4 %}
        vrrp: {group_id: {{ vid }}, name: '{{ site }}-{{ name }}', vip: '{{ pool[subnet + 1] }}/24', priority: {{ 200 if i == 2 else 100 }}}
{% endif %}
{% endfor %}
{% if i != 4 %}
      Ethernet6:
        type: 1000base-t
        description: leaf-1/2 VRRP VLAN trunk
        mode: tagged
        tagged_vlans: [{group: '{{ group }}', vid: 100}, {group: '{{ group }}', vid: 110}, {group: '{{ group }}', vid: 120}]
{% if i == 2 %}
        connection: {device: '{{ site }}-leaf-2', interface: Ethernet6, type: cat6, status: connected}
{% endif %}
{% endif %}
{% endif %}
    bgp_peerings:
{% for peer in (range(2) if leaf else range(2, 5)) %}
{% set link = peer * 3 + i - 2 if leaf else i * 3 + peer - 2 %}
      {{ site }}-{{ nodes[i] }}-to-{{ nodes[peer] }}:
        local_address: '{{ pool[2 * link + (1 if leaf else 0)] }}'
        remote_address: '{{ pool[2 * link + (0 if leaf else 1)] }}'
        local_as: {{ 65001 + i }}
        remote_as: {{ 65001 + peer }}
        status: active
        create_reverse: false
{% endfor %}
    local_context_data:
      ip_routing: true
      bgp:
        asn: {{ 65001 + i }}
        router_id: '{{ pool[33 + i] }}'
        maximum_paths: 2
        multipath_relax: true
        originate:
          - '{{ pool[33 + i] }}/32'
{% if leaf %}
{% for v in range(3) %}
          - '{{ pool[256 * (1 + (3 if i == 4 else 0) + v)] }}/24'
{% endfor %}
{% endif %}
{% endfor %}
primary_ip:
{% for i in range(5) %}
  - {device: '{{ site }}-{{ nodes[i] }}', site: '{{ site }}', address: '{{ pool[33 + i] }}/32'}
{% endfor %}
