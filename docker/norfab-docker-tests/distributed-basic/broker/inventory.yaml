broker:
  endpoint: "{{ env.get('NORFAB_BROKER_ENDPOINT', 'tcp://0.0.0.0:5555') }}"
  zmq_auth: true

logging:
  handlers:
    file:
      level: "{{ env.get('FILE_LOGGING_LEVEL', 'INFO') }}"
    terminal:
      level: "{{ env.get('TERMINAL_LOGGING_LEVEL', 'INFO') }}"
  log_events: true

plugins:
  DummyService:
    nfcli:
      mount_path: dummy
      shell_model: plugins.dummy_service:DummyServiceNfcliShell
    worker: plugins.dummy_service:DummyServiceWorker

topology:
  broker: true
  workers:
    - netbox-worker-1.1
    - nornir-worker-1
    - nornir-worker-2
    - dummy-worker-1

workers:
  dummy-worker-1:
    - /workspace/tests/nf_tests_inventory/plugins/dummy_worker_inventory.yaml
  netbox-worker-1.*:
    - /workspace/tests/nf_tests_inventory/netbox/common.yaml
  nornir-*:
    - /workspace/tests/nf_tests_inventory/nornir/common.yaml
  nornir-worker-1*:
    - /workspace/tests/nf_tests_inventory/nornir/nornir-worker-1.yaml
  nornir-worker-2:
    - /workspace/tests/nf_tests_inventory/nornir/nornir-worker-2.yaml
    - /workspace/tests/nf_tests_inventory/nornir/nornir-worker-2-extra.yaml
